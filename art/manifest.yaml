# Which picture sits where on each generated sheet, row by row from the top left.
# `kind: terrain` cells become flat ground tiles, `kind: object` cells keep what
# stands on the ground and lose the earth rim underneath. `kind: figure` cells
# lose their ground altogether, so people can stand on any tile.
sheets:
  - file: sheets/terrain-1.png
    kind: terrain
    cells: [grass, dry_grass, forest_floor, sand, rock, snow, shallow_water, deep_water]
  - file: sheets/terrain-2.png
    kind: terrain
    cells: [moss, tundra, steppe, marsh, mud, farmland, path, ice]
  - file: sheets/nature-1.png
    kind: object
    cells: [oak, pine, birch, dead_tree, berry_bush, reeds, boulder, copper_rock]
  - file: sheets/buildings-1.png
    kind: object
    cells: [campfire, tent, hut, drying_rack, storage_pit, kiln, site, ruin]
  - file: sheets/people-1.png
    kind: figure
    cells: [woman, man, child, elder, hunter, gatherer, fisher, travellers]
