name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Reference world digest
        shell: bash
        run: |
          uv run hiab simulate --years 500 --seed 42 --out ref.sqlite --log-level WARNING
          uv run python -c "from pathlib import Path; from hiab.db.store import table_digests; import json; print(json.dumps(table_digests(Path('ref.sqlite')), indent=1))" > digest-${{ matrix.os }}.json
          cat digest-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Built frontend is committed
        run: test -f src/hiab/web/index.html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hiab:ci .
      - name: Container serves a world
        run: |
          docker run -d --name hiab -p 2222:2222 -e HIAB_SEED=42 -e HIAB_PACE=6000 hiab:ci
          for attempt in $(seq 1 30); do
            if curl -fs http://127.0.0.1:2222/api/v1/worlds/1/stats; then break; fi
            sleep 2
          done
          ok=1
          curl -fs http://127.0.0.1:2222/api/v1/worlds/1/stats | grep -q '"seed":42' || ok=0
          curl -fs http://127.0.0.1:2222/ | grep -q "Humankind in a Box" || ok=0
          docker ps -a
          docker logs hiab 2>&1 | grep -v "slower than pace" | tail -40
          [ "$ok" = 1 ]

  same-world-everywhere:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Compare digests across operating systems
        run: |
          diff --strip-trailing-cr digest-ubuntu-latest.json digest-windows-latest.json
          diff --strip-trailing-cr digest-ubuntu-latest.json digest-macos-latest.json
          echo "The seed 42 world is identical on Linux, Windows and macOS."
