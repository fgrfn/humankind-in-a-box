drought:
  importance: 2
  text:
    de: "Dürre in {region}: Das Land trocknet aus, Wild und Boden leiden."
    en: "Drought in {region}: the land dries out, game and soil suffer."
harsh_winter:
  importance: 2
  text:
    de: "Ein harter Winter trifft {region}. Viel Wild überlebt ihn nicht."
    en: "A harsh winter hits {region}. Much of the game does not survive."
wildfire:
  importance: 2
  text:
    de: "Ein Waldbrand zieht durch {region}."
    en: "A wildfire sweeps through {region}."
flood:
  importance: 2
  text:
    de: "Die Flüsse treten in {region} über die Ufer und hinterlassen fruchtbaren Schlamm."
    en: "The rivers of {region} burst their banks and leave fertile silt behind."
fish_boom:
  importance: 1
  text:
    de: "Die Gewässer von {region} sind in diesem Jahr voller Fisch."
    en: "The waters of {region} are teeming with fish this year."
mild_year:
  importance: 1
  text:
    de: "Ein mildes, reiches Jahr in {region}."
    en: "A mild and plentiful year in {region}."
warm_phase_begins:
  importance: 3
  text:
    de: "Eine Warmzeit beginnt. Die Sommer werden länger."
    en: "A warm period begins. Summers grow longer."
cold_phase_begins:
  importance: 3
  text:
    de: "Eine Kaltzeit beginnt. Die Winter werden strenger."
    en: "A cold period begins. Winters grow harsher."
climate_normalises:
  importance: 2
  text:
    de: "Das Klima kehrt zu gewohnten Verhältnissen zurück."
    en: "The climate returns to familiar conditions."
humankind_begins:
  importance: 5
  text:
    de: "Die ersten Familien lagern gemeinsam. Sie nennen sich {clan}."
    en: "The first families camp together. They call themselves {clan}."
humankind_extinct:
  importance: 5
  text:
    de: "Der letzte Mensch ist gestorben. Die Welt ist wieder still."
    en: "The last human has died. The world is silent again."
birth:
  importance: 1
  text:
    de: "{name} wird bei den {clan} geboren."
    en: "{name} is born among the {clan}."
death:
  importance: 1
  text:
    de: "{name} von den {clan} stirbt im Alter von {age} Jahren."
    en: "{name} of the {clan} dies at the age of {age}."
pairing:
  importance: 1
  text:
    de: "{name} und {partner} von den {clan} tun sich zusammen."
    en: "{name} and {partner} of the {clan} become a couple."
migration:
  importance: 1
  text:
    de: "Die {clan} ziehen weiter."
    en: "The {clan} move on."
famine:
  importance: 2
  text:
    de: "Die {clan} hungern."
    en: "The {clan} are starving."
discovery:
  importance: 4
  text:
    de: "{name} von den {clan} entdeckt: {tech}."
    en: "{name} of the {clan} discovers: {tech}."
knowledge_shared:
  importance: 2
  text:
    de: "Die {clan} lernen von den {teacher}: {tech}."
    en: "The {clan} learn from the {teacher}: {tech}."
clan_split:
  importance: 3
  text:
    de: "Die {clan} sind zu viele geworden. Ein Teil zieht fort und nennt sich {new_clan}."
    en: "The {clan} have grown too many. Some leave and call themselves {new_clan}."
clan_merged:
  importance: 2
  text:
    de: "Die letzten der {clan} schließen sich den {host} an."
    en: "The last of the {clan} join the {host}."
clan_died_out:
  importance: 3
  text:
    de: "Die {clan} sind ausgestorben."
    en: "The {clan} have died out."
settlement_founded:
  importance: 4
  text:
    de: "Die {clan} bleiben. Sie gründen die Siedlung {place}."
    en: "The {clan} stay. They found the settlement {place}."
settlement_abandoned:
  importance: 3
  text:
    de: "Der Hunger vertreibt die {clan} aus {place}."
    en: "Hunger drives the {clan} out of {place}."
construction_started:
  importance: 2
  text:
    de: "Die {clan} beginnen in {place} mit dem Bau: {building}."
    en: "The {clan} start building in {place}: {building}."
building_finished:
  importance: 3
  text:
    de: "In {place} steht ein neues Bauwerk: {building}."
    en: "A new structure stands in {place}: {building}."
building_ruined:
  importance: 2
  text:
    de: "Im verlassenen {place} verfällt ein Bauwerk: {building}."
    en: "In abandoned {place} a structure falls into ruin: {building}."
