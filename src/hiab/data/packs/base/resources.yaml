# Stocks renew on their own. Capacity is per tile of a biome, 0..1000.
plants:
  kind: stock
  name: {de: Wildpflanzen, en: Wild plants}
  work: {de: sammelt Pflanzen, en: gathering plants}
  food_value: 1
  harvest_base_percent: 100
  capacity: {forest: 600, grassland: 550, marsh: 500, steppe: 300, taiga: 250, tundra: 80, mountain: 100, desert: 30}
  regrowth_percent_per_month: 12
  season_percent: {spring: 140, summer: 150, autumn: 110, winter: 10}
